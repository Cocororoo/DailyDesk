<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>每日上班 · 日常控制台</title>
  <link rel="icon" href="/brand-icon">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#overview"><img class="brand-logo" src="/brand-icon" alt=""><span>每日上班<small>日常控制台</small></span></a>
    <div class="nav-label">控制台</div>
    <nav aria-label="主要导航">
      <a href="#overview" data-nav="overview"><span data-icon="layout"></span>总览<span class="nav-dot"></span></a>
      <a href="#plans" data-nav="plans"><span data-icon="sliders"></span>任务计划</a>
      <a href="#history" data-nav="history"><span data-icon="history"></span>运行记录<span id="history-count" class="nav-count">—</span></a>
      <a href="#updates" data-nav="updates"><span data-icon="download"></span>软件更新</a>
    </nav>
    <div class="sidebar-bottom"><div class="local-pill"><i></i>本机运行</div><a href="#about" class="text-link"><span data-icon="info"></span>关于</a></div>
  </aside>
  <div class="workspace">
    <header class="topbar"><div class="breadcrumb">控制台 <span>/</span> <strong id="page-label">总览</strong></div><div class="top-actions"><span id="connection" class="connection"><i></i>正在连接</span><button class="icon-btn" id="refresh" aria-label="刷新数据" title="刷新数据"><span data-icon="refresh"></span></button></div></header>
    <main id="main" tabindex="-1"><div class="loading"><span class="spinner"></span>正在读取本机计划与运行记录…</div></main>
    <footer><span>每日上班控制台</span><span>本地运行 · 本机时区</span></footer>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="detail-dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
  <dialog id="plan-dialog" aria-labelledby="plan-dialog-title"><div class="dialog-header"><div class="plan-dialog-heading" id="plan-dialog-heading"></div><button class="icon-btn" id="close-plan" aria-label="关闭任务设置"><span data-icon="close"></span></button></div><div class="dialog-content" id="plan-dialog-content"></div><div id="plan-dialog-footer"></div></dialog>
  <dialog id="confirm-dialog" aria-labelledby="confirm-title"><div class="confirm-body"><div class="confirm-symbol" data-icon="play"></div><h2 id="confirm-title"></h2><p id="confirm-text"></p><div class="dialog-actions"><button class="btn" id="confirm-cancel">取消</button><button class="btn primary" id="confirm-go">确认启动</button></div></div></dialog>
</body>
</html>
